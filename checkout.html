<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MuemaStore | Checkout</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <a class="logo" href="index.html">MuemaStore</a>
    <input type="text" id="searchInput" placeholder="Search products..." />
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="index.html#products">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <a class="cart" href="cart.html">🛒 <span id="cartCount">0</span></a>
  </header>

  <main class="checkout-page">
    <div class="checkout-wrap glass">
      <h1>Checkout</h1>

      <div class="checkout-grid">
        <form id="checkoutForm" class="checkout-form">
          <h2>Shipping Information</h2>
          <label>Full name
            <input type="text" id="shipName" required />
          </label>
          <label>Phone
            <input type="tel" id="shipPhone" required />
          </label>
          <label>Address
            <input type="text" id="shipAddress" required />
          </label>
          <label>City
            <input type="text" id="shipCity" required />
          </label>

          <h2>Payment</h2>
          <label>Payment method
            <select id="paymentMethod">
              <option value="mpesa">M-Pesa</option>
              <option value="card">Card (simulated)</option>
            </select>
          </label>

          <button type="submit" class="btn-primary">Place Order</button>
        </form>

        <aside class="order-summary glass" id="orderSummary">
          <!-- Order summary filled by JS -->
        </aside>
      </div>

      <div id="orderResult" class="order-result"></div>
    </div>
  </main>

  <footer class="footer glass">
    <div class="footer-content">
      <h2>MuemaStore</h2>
      <p>Your friendly online marketplace — shop smart, shop purple.</p>
      <p>&copy; 2025 MuemaStore</p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderCheckoutSummary();
      document.getElementById('checkoutForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('shipName').value.trim();
        const phone = document.getElementById('shipPhone').value.trim();
        const address = document.getElementById('shipAddress').value.trim();
        if(!name || !phone || !address){
          alert('Please complete the required shipping fields.');
          return;
        }
        // Place order
        const order = placeOrder({ name, phone, address });
        const resultDiv = document.getElementById('orderResult');
        resultDiv.innerHTML = `
          <div class="glass order-confirm">
            <h2>Order Placed</h2>
            <p>Thank you, ${order.name}! Your order <strong>#${order.orderId}</strong> has been placed.</p>
            <p>Total paid: <strong>KES ${order.total.toFixed(2)}</strong></p>
            <a href="index.html" class="btn-primary">Continue Shopping</a>
          </div>
        `;
      });
    });
  </script>
</body>
</html>
