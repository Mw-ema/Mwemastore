<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MuemaStore | Contact</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <a class="logo" href="index.html">MuemaStore</a>
    <input type="text" id="searchInput" placeholder="Search products..." />
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="index.html#products">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <a class="cart" href="cart.html">🛒 <span id="cartCount">0</span></a>
  </header>

  <main class="static-page">
    <div class="content-wrap glass">
      <h1>Contact Us</h1>
      <p>Have a question or need help with an order? Send us a message:</p>

      <form id="contactForm" class="contact-form">
        <label>Name
          <input id="contactName" required />
        </label>
        <label>Email
          <input id="contactEmail" type="email" required />
        </label>
        <label>Message
          <textarea id="contactMessage" rows="5" required></textarea>
        </label>
        <button type="submit" class="btn-primary">Send Message</button>
      </form>

      <div id="contactResult"></div>
    </div>
  </main>

  <footer class="footer glass">
    <div class="footer-content">
      <h2>MuemaStore</h2>
      <p>&copy; 2025 MuemaStore</p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('contactForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('contactName').value.trim();
        const email = document.getElementById('contactEmail').value.trim();
        const msg = document.getElementById('contactMessage').value.trim();
        if(!name || !email || !msg) {
          alert('Please complete all fields.');
          return;
        }
        document.getElementById('contactResult').innerHTML = `
          <div class="glass" style="padding:12px;margin-top:12px;">
            <strong>Thanks ${name}!</strong>
            <p>Your message has been received. We'll reply to ${email} soon.</p>
          </div>
        `;
        document.getElementById('contactForm').reset();
      });
    });
  </script>
</body>
</html>
